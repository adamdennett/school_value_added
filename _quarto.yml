    left: "Adam Dennett · Bartlett Centre for Advanced Spatial Analysis, UCL"
    right: "Built from published DfE and Ofsted data. Nothing uses pupil-level records."

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-location: left
    code-fold: true
    code-summary: "Show code"
    fig-cap-location: bottom
    fig-width: 9
    fig-height: 5.5
    fig-dpi: 108
    link-external-newwindow: true

execute:
  echo: false
  warning: false
  message: false
