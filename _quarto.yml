            text: "Across England"
          - href: bh_effect.qmd
            text: "Brighton and Hove"
          - href: neighbourhood_types.qmd
            text: "Neighbourhood types (OAC)"
          - href: neighbourhood_covariates.qmd
            text: "Neighbourhood covariates (experiment)"
          - href: distance.qmd
